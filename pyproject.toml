[project]
name = "fire-surveillance"
version = "0.1.0"
description = "IR/thermal camera RTSP surveillance UI (UI + RTSP display only, no fire detection)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "JiuHeng" }]
dependencies = [
    "pyside6>=6.8,<6.10",
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
    "pyinstaller>=6.0,<7",
]

[project.scripts]
fire-surveillance = "fire_surveillance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_surveillance"]

[tool.uv]
package = true
